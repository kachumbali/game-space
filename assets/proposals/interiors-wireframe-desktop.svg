tatus</text><rect class="box" x="267" y="64" width="284" height="203" rx="4"/><text class="small" x="275" y="83">SELECTED • record / medals</text><rect class="warn" x="8" y="275" width="544" height="30" rx="4"/><text class="small" x="16" y="294">BACK     CONTEXT / ACTION</text></g><g transform="translate(1180,55)"><rect width="560" height="315" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">FLEET / STORES</text><rect class="box" x="8" y="30" width="544" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="251" height="203" rx="4"/><text class="small" x="16" y="83">SHIPS / PILOTS / ORDNANCE</text><rect class="box" x="267" y="64" width="284" height="203" rx="4"/><text class="small" x="275" y="83">SELECTED • available / assigned</text><rect class="warn" x="8" y="275" width="544" height="30" rx="4"/><text class="small" x="16" y="294">BACK     CONTEXT / ACTION</text></g><g transform="translate(1760,55)"><rect width="560" height="315" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">NAV MAP / BRIEFING</text><rect class="box" x="8" y="30" width="544" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="251" height="203" rx="4"/><text class="small" x="16" y="83">NAV MAP • route and objective</text><rect class="box" x="267" y="64" width="284" height="203" rx="4"/><text class="small" x="275" y="83">BRIEF • risks / launch</text><rect class="warn" x="8" y="275" width="544" height="30" rx="4"/><text class="small" x="16" y="294">BACK     CONTEXT / ACTION</text></g><g transform="translate(2340,55)"><rect width="560" height="315" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">DEBRIEF</text><rect class="box" x="8" y="30" width="544" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES