<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="620" viewBox="0 0 1420 620"><rect width="100%" height="100%" fill="#101820"/><style>text{font-family:Arial,sans-serif;fill:#d6d5be} .small{font-size:12px}.label{font-size:15px;font-weight:bold}.box{fill:#202b30;stroke:#738694;stroke-width:2}.accent{fill:#263b3d;stroke:#55c4c5;stroke-width:2}.warn{fill:#463326;stroke:#da8a37;stroke-width:2}</style><text class="label" x="20" y="25">PHONE-PORTRAIT • five navigable views • schematic, not final art</text><g transform="translate(20,55)"><rect width="260" height="520" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">HUB / HOTSPOTS</text><rect class="box" x="8" y="30" width="244" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="box" x="8" y="64" width="244" height="408" rx="4"/><text class="small" x="16" y="83">ROOM ART • briefing / deck / mess / CIC</text><rect class="accent" x="18" y="90" width="105" height="38" rx="4"/><text class="small" x="26" y="109">BRIEFING</text><rect class="accent" x="135" y="140" width="107" height="38" rx="4"/><text class="small" x="143" y="159">FLIGHT DECK</text><rect class="accent" x="18" y="195" width="105" height="38" rx="4"/><text class="small" x="26" y="214">MESS</text><rect class="accent" x="135" y="210" width="107" height="38" rx="4"/><text class="small" x="143" y="229">CIC</text><rect class="warn" x="8" y="480" width="244" height="30" rx="4"/><text class="small" x="16" y="499">BACK     CONTEXT / ACTION</text></g><g transform="translate(300,55)"><rect width="260" height="520" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">ROSTER / SERVICE RECORD</text><rect class="box" x="8" y="30" width="244" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="244" height="200" rx="4"/><text class="small" x="16" y="83">PILOT LIST • status</text><rect class="box" x="8" y="272" width="244" height="200" rx="4"/><text class="small" x="16" y="291">SELECTED • record / medals</text><rect class="warn" x="8" y="480" width="244" height="30" rx="4"/><text class="small" x="16" y="499">BACK     CONTEXT / ACTION</text></g><g transform="translate(580,55)"><rect width="260" height="520" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">FLEET / STORES</text><rect class="box" x="8" y="30" width="244" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="244" height="200" rx="4"/><text class="small" x="16" y="83">SHIPS / PILOTS / ORDNANCE</text><rect class="box" x="8" y="272" width="244" height="200" rx="4"/><text class="small" x="16" y="291">SELECTED • available / assigned</text><rect class="warn" x="8" y="480" width="244" height="30" rx="4"/><text class="small" x="16" y="499">BACK     CONTEXT / ACTION</text></g><g transform="translate(860,55)"><rect width="260" height="520" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">NAV MAP / BRIEFING</text><rect class="box" x="8" y="30" width="244" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="244" height="200" rx="4"/><text class="small" x="16" y="83">NAV MAP • route and objective</text><rect class="box" x="8" y="272" width="244" height="200" rx="4"/><text class="small" x="16" y="291">BRIEF • risks / launch</text><rect class="warn" x="8" y="480" width="244" height="30" rx="4"/><text class="small" x="16" y="499">BACK     CONTEXT / ACTION</text></g><g transform="translate(1140,55)"><rect width="260" height="520" fill="#131719" stroke="#d6d5be" stroke-width="2"/><text class="label" x="10" y="22">DEBRIEF</text><rect class="box" x="8" y="30" width="244" height="26" rx="4"/><text class="small" x="16" y="49">HUB   ROSTER   STORES   MAP   DEBRIEF</text><rect class="accent" x="8" y="64" width="244" height="200" rx="4"/><text class="small" x="16" y="83">OUTCOME • objective status</text><rect class="box" x="8" y="272" width="244" height="200" rx="4"/><text class="small" x="16" y="291">LOSSES / AWARDS / CONTINUE</text><rect class="warn" x="8" y="480" width="244" height="30" rx="4"/><text class="small" x="16" y="499">BACK     CONTEXT / ACTION</text></g></svg>