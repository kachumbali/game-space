name: build
on: [push, pull_request]
jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }             # check_opsec.py also checks commit authors since its cutoff
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # build.py concatenates src/* AND fails on duplicate top-level names
      # (the _bm merge collision broke the whole page once; owner P0 2026-10-22)
      - run: python3 build.py
      - run: python3 tools/check_opsec.py     # no real names / emails in the repo
      - run: python3 tools/validate_db.py     # data/db.json consistency (weapons exist, mounts point at real components)
      - uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: index.html
  playwright:
    runs-on: ubuntu-latest
    needs: build-lint
    timeout-minutes: 10
    steps:
      - run: echo "GS_TEST_DIR=$RUNNER_TEMP/gs_test" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: index-html
          path: .
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Playwright, Chromium, and Three.js
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --prefix "$GS_TEST_DIR" three@0.170.0
      - name: Run browser and regression tests
        run: |
          set -o pipefail
          mkdir -p test-logs
          run_logged() {
            name="$1"
            shift
            echo "=== $name ==="
            "$@" 2>&1 | tee "test-logs/$name.log"
          }
          run_logged build-lint python3 tools/tests/build_lint_t.py
          run_logged db-validation python3 tools/validate_db.py
          run_logged suite1 python3 tools/tests/suite1.py
          run_logged p0 python3 tools/tests/p0_t.py
          run_logged credits-briefing python3 tools/tests/cred_t.py
          run_logged credits-options python3 tools/tests/cred_t2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-logs
          path: test-logs/
          if-no-files-found: warn
  bullfrog-groups:
    runs-on: ubuntu-latest
    needs: build-lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [spine, exeter, xl_filter, friendly, arcs, pd, hangar, inst, blast, m3, warn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: index-html
          path: .
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install browser dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/gs_test" three@0.170.0
      - name: Run Bullfrog scenario
        env:
          GS_TEST_DIR: ${{ runner.temp }}/gs_test
        run: python3 tools/tests/bullfrog_t.py "${{ matrix.group }}"
  # The merge gate (docs/ROADMAP.md): build + opsec + db + browser smoke test of every mode on desktop and iPad-sized touch.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "GS_TEST_DIR=$RUNNER_TEMP/gs_test" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Playwright, Chromium, and Three.js
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --prefix "$GS_TEST_DIR" three@0.170.0
      - run: python3 tools/gate.py
  # Publish the built game to the gh-pages branch (index.html is built here; only runtime files are published).
  # Pages setting: Settings > Pages > Deploy from a branch > gh-pages / (root).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the site
        run: |
          python3 build.py
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp -r audio _site/audio
          cp -r assets/scenes _site/assets/scenes
          cp data/db.json _site/data/db.json
          touch _site/.nojekyll
          echo "built from $GITHUB_SHA" > _site/BUILD.txt
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $GITHUB_SHA"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
